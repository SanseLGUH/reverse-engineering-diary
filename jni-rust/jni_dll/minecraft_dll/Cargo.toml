[package]
name = "minecraft"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61.2", features = [
	"Win32", "Win32_System", "Win32_System_Console", 
	"Win32_Storage", "Win32_Storage_FileSystem", "Win32_Security"] }

jni = { version = "0.22.4", features = ["invocation"] }
